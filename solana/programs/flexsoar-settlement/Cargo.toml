[package]
name = "flexsoar-settlement"
version = "0.1.0"
edition = "2021"
# Must match the platform-tools rustc that compiles the program (1.79):
# with the fallback resolver above, cargo steers off edition2024 crates.
rust-version = "1.79"

[lib]
crate-type = ["cdylib", "lib"]
name = "flexsoar_settlement"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Required by `anchor build` for IDL generation (anchor#4770 follow-up).
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
